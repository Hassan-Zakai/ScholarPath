<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarships | ScholarPath</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            Scholar<span>Path</span>
        </div>

        <button class="menu-toggle" id="menu-toggle">☰</button>

        <!-- Navigation -->
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="scholarships.html">Scholarships</a>
            <a href="universities.html">Universities</a>
            <a href="admissions.html">Admissions</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="scholarships-page">

        <h1>Explore Scholarships</h1>
        <p>
            Discover scholarship opportunities around the world
            and find financial support for your education.
        </p>

        <!-- Filters required by scholarships.js -->
        <div class="filters">
            <select id="country-filter">
                <option value="">All Countries</option>
            </select>

            <select id="field-filter">
                <option value="">All Fields</option>
            </select>
        </div>

        <!-- Results Count required by scholarships.js -->
        <div class="results">
            <p>Total Scholarships: <strong id="result-count">0</strong></p>
        </div>

        <!-- Scholarship Cards Container required by scholarships.js -->
        <section class="scholarship-cards" id="scholarship-cards"></section>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <h2>ScholarPath</h2>
        <p>Explore Opportunities. Plan Your Future.</p>
        <p>Student Project</p>
    </footer>

    <!-- JavaScript -->
    <script src="js/main.js"></script>
    <script src="js/scholarships.js"></script>

</body>
</html>
